name: Spore Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create and release (e.g., v0.2.0). Empty skips the release job.'
        required: false
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        default: true
        type: boolean
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
          - os: macos-14
            target: macos-aarch64
          - os: windows-2022
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Elixir and Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29.0.5'
          elixir-version: '1.20.4'

      - name: Install deps (Unix)
        if: runner.os != 'Windows'
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Install deps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Build release (Unix)
        if: runner.os != 'Windows'
        run: MIX_ENV=prod mix release

      - name: Build release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MIX_ENV = 'prod'
          mix release

      - name: Archive release (Unix)
        if: runner.os != 'Windows'
        run: tar czf "spore-${{ matrix.target }}.tar.gz" -C _build/prod/rel spore

      - name: Archive release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path _build/prod/rel/spore -DestinationPath "spore-${{ matrix.target }}.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spore-${{ matrix.target }}
          path: spore-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create and push git tag
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        run: |
          git config user.name "Rastrian"
          git config user.email "10719452+Rastrian@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/${{ inputs.tag }}"; then
            echo "Tag ${{ inputs.tag }} already exists on origin, skipping creation"
          else
            git tag "${{ inputs.tag }}"
            git push origin "${{ inputs.tag }}"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release files
        run: ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
